[package]
name = "ezd-android"
description = "ezdisplay Android client native library: JNI bridge, AMediaCodec decode to a Surface"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "ezd_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
ezd-client-core = { path = "../ezd-client-core", features = ["wifi"] }
ezd-input.workspace = true
ezd-link.workspace = true
ezd-proto.workspace = true
tokio.workspace = true
tracing = { workspace = true, features = ["log"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
jni = "0.22"
libc = "0.2"
log = "0.4"
ndk = { version = "0.9", default-features = false, features = ["media", "nativewindow", "api-level-26"] }

[lints]
workspace = true
