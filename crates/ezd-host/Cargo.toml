[package]
name = "ezd-host"
description = "ezdisplay host: streams a virtual display to the tablet, plus diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "ezd-host"
path = "src/main.rs"

[features]
default = ["ffmpeg", "wifi", "aoa"]
# Encoder probing in `diag` and the service's FFmpeg paths. `--no-default-features` builds without
# FFmpeg headers (the Windows cross-check in CI).
ffmpeg = ["dep:ezd-ffmpeg", "ezd-host-service/ffmpeg", "ezd-host-windows/ffmpeg"]
# Wi-Fi (QUIC) transport: `run --wifi`, `--pair` and the `paired` commands.
wifi = ["ezd-host-service/wifi", "dep:qrcode"]
# USB without developer mode (Android accessory mode through libusb): `run --aoa` and the `usb`
# section of `diag`. `--no-default-features` builds without libusb (the Windows cross-check in CI).
aoa = ["ezd-host-service/aoa", "ezd-link/aoa"]

[dependencies]
qrcode = { workspace = true, optional = true }
anyhow.workspace = true
clap.workspace = true
ezd-ffmpeg = { workspace = true, optional = true }
ezd-host-core.workspace = true
ezd-host-service.workspace = true
ezd-link.workspace = true
i18n-embed.workspace = true
i18n-embed-fl.workspace = true
rust-embed.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
ezd-host-windows.workspace = true

[lints]
workspace = true
