[package]
name = "ezd-host-linux"
description = "ezdisplay Linux host backend: KDE virtual output, PipeWire capture, VAAPI/NVENC encode"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

# The crate is empty on other targets (`#![cfg(target_os = "linux")]`), so `cargo build --workspace`
# on Windows must not build PipeWire or the portal client.
[target.'cfg(target_os = "linux")'.dependencies]
ezd-host-core.workspace = true
ezd-ffmpeg.workspace = true
ezd-proto.workspace = true
# zbus runs on its own async-io executor rather than on tokio: in the tray app other zbus users
# (the tray icon, the window's accessibility bridge) run on threads without a tokio runtime, and
# zbus' `tokio` feature would make every one of them need one. The futures still run inside tokio.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast"] }
pipewire = "0.10"
libc = "0.2"
evdev = "0.13"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
tokio = { workspace = true }
serde_json.workspace = true
tracing.workspace = true
# Direct Wayland capture for the wlroots compositors (ext-image-copy-capture, wlr-screencopy).
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# Pure-Rust X11 client for the X11 backend: RandR monitor, MIT-SHM + XDamage capture, XFixes cursor,
# XInput2 device transformation (XTest drives the integration test).
x11rb = { version = "0.13", features = ["randr", "shm", "xfixes", "damage", "xinput", "xtest"] }
# Only the bindings: functions are loaded through FFmpeg's Vulkan device.
ash = { version = "0.38", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tracing-subscriber.workspace = true

[lints.rust]
# FFI to FFmpeg (DRM frame descriptors, filter graphs), PipeWire raw buffers and libc fd handling.
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
