[package]
name = "ezd-tray"
description = "ezdisplay: the PC tray app with a settings and statistics window"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# eframe 0.37 needs 1.95; the rest of the workspace stays on the lower MSRV.
rust-version = "1.95"
build = "build.rs"

[[bin]]
name = "ezdisplay"
path = "src/main.rs"

[features]
default = ["ffmpeg"]
# FFmpeg paths of the service. `--no-default-features` builds without FFmpeg headers (the Windows
# cross-check in CI).
ffmpeg = ["ezd-host-service/ffmpeg"]
# Local only: PNG snapshots of the window (needs a GPU/wgpu). CI never enables it.
snapshots = ["egui_kittest/snapshot", "egui_kittest/wgpu"]

[dependencies]
auto-launch = "0.6"
clap.workspace = true
dirs = "7"
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "accesskit", "default_fonts"] }
ezd-host-service.workspace = true
ezd-link.workspace = true
ezd-proto.workspace = true
i18n-embed.workspace = true
i18n-embed-fl.workspace = true
interprocess = "2.4"
png = "0.18"
rust-embed.workspace = true
serde.workspace = true
tokio.workspace = true
toml = "0.9"
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber.workspace = true
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(windows)'.dependencies]
ezd-host-windows.workspace = true
serde_json.workspace = true

[dev-dependencies]
egui_kittest = "0.37"
ezd-host-core.workspace = true
tempfile = "3"

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
