name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  linux:
    name: Linux (fmt, clippy, test)
    runs-on: ubuntu-24.04
    # Arch ships FFmpeg 8.x, PipeWire and libva recent enough for the KDE host backend.
    container: archlinux:latest
    steps:
      - name: Install system packages
        run: |
          pacman -Syu --noconfirm --needed base-devel clang pkgconf ffmpeg pipewire libva git curl
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Windows (build, test, artifact)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # The RUSTFLAGS environment variable replaces the rustflags of .cargo/config.toml, so the
      # static CRT (no VC++ runtime needed on a clean Windows) is repeated here.
      RUSTFLAGS: "-D warnings -C target-feature=+crt-static"
      # MSVC writes release debug info to PDB files that no artifact ships, and producing them
      # makes the release build about 75 s slower.
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # A failed run still saves its build, so the next push does not start cold. Only main
          # saves, which keeps the repository cache under its size limit.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch pinned FFmpeg (SHA-256 checked; headers + import libs)
        shell: pwsh
        run: |
          ./packaging/windows/stage.ps1 -RepoRoot $PWD -CacheDir "$env:RUNNER_TEMP\pins" -FfmpegOnly
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: cargo build --workspace --release
      - name: Check the C runtime is linked statically
        shell: pwsh
        run: |
          # The import table names the DLLs a binary needs; scan it for the VC++ runtime.
          foreach ($exe in 'ezd-host.exe', 'ezdisplay.exe') {
            $path = "target\release\$exe"
            if (-not (Test-Path $path)) { continue }
            $text = [Text.Encoding]::Latin1.GetString([IO.File]::ReadAllBytes($path))
            foreach ($dll in 'VCRUNTIME140', 'MSVCP140') {
              if ($text.IndexOf($dll, [StringComparison]::OrdinalIgnoreCase) -ge 0) {
                throw "$exe imports $dll.dll: the static CRT is not applied"
              }
            }
          }
          if (-not (Test-Path target\release\ezd-host.exe)) { throw "ezd-host.exe not built" }
      - name: Smoke test (ezd-host diag)
        shell: pwsh
        # diag starts the adb server; if that server inherited our stdout, the pipe below would
        # never reach EOF.
        timeout-minutes: 5
        run: |
          # A runner has no physical GPU or VDD: the point is that the binary starts with the
          # FFmpeg DLLs, enumerates DXGI, prints valid JSON and the pipeline ends.
          .\target\release\ezd-host.exe diag | Tee-Object -FilePath diag.json
          if ($LASTEXITCODE -ne 0) { throw "ezd-host diag failed ($LASTEXITCODE)" }
          Get-Content -Raw diag.json | ConvertFrom-Json | Out-Null
      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\ezdisplay.exe, target\release\ezd-host.exe, target\release\ezd-fake-client.exe dist\
          Copy-Item "$env:FFMPEG_DIR\bin\*.dll" dist\
          Copy-Item LICENSE-MIT, LICENSE-APACHE dist\
      - uses: actions/upload-artifact@v4
        with:
          name: ezdisplay-windows-x86_64
          path: dist/
          if-no-files-found: error
      - name: Stage installer files
        shell: pwsh
        run: ./packaging/windows/stage.ps1 -RepoRoot $PWD -OutDir "$env:RUNNER_TEMP\staging" -CacheDir "$env:RUNNER_TEMP\pins"
      - name: Build installer
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $pkg = $meta.packages | Where-Object { $_.name -eq 'ezd-tray' } | Select-Object -First 1
          if (-not $pkg) { $pkg = $meta.packages | Where-Object { $_.name -eq 'ezd-host' } | Select-Object -First 1 }
          $version = $pkg.version
          Write-Host "Installer version $version"
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$version" "/DStagingDir=$env:RUNNER_TEMP\staging" "/O$PWD\installer-out" packaging\windows\ezdisplay.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
      - uses: actions/upload-artifact@v4
        with:
          name: ezdisplay-windows-installer
          path: installer-out/ezdisplay-setup-*-x64.exe
          if-no-files-found: error
      # The installer is uploaded before the tests run, so it can be tried on a real PC while they
      # finish.
      - run: cargo test --workspace
      - name: Installer smoke test (install, upgrade, uninstall)
        shell: pwsh
        timeout-minutes: 10
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          $installer = (Get-ChildItem installer-out\ezdisplay-setup-*-x64.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:ProgramFiles 'ezdisplay'
          $silent = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'

          # 1. Clean install without the driver and autostart (this really downloads FFmpeg).
          $p = Start-Process $installer -ArgumentList ($silent + '/MERGETASKS=!driver,!autostart', "/LOG=$PWD\logs\install.log") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $expected = 'ezdisplay.exe', 'ezd-host.exe', 'ffmpeg.sha256', 'driver\MttVDD.inf', 'driver\mttvdd.cat',
            'driver\nefconw.exe', 'adb\adb.exe', 'licenses\LICENSE-MIT', 'licenses\FFmpeg-NOTICE.txt',
            'licenses\FFmpeg-LICENSE.txt'
          foreach ($f in $expected) {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing after install: $f" }
          }
          if (-not (Get-ChildItem $dir -Filter 'avcodec-*.dll')) { throw 'FFmpeg DLLs missing' }

          # 2. The installed host starts with the FFmpeg DLLs and prints valid JSON.
          & "$dir\ezd-host.exe" diag | Tee-Object -FilePath logs\diag.json
          if ($LASTEXITCODE -ne 0) { throw "installed ezd-host diag failed ($LASTEXITCODE)" }
          Get-Content -Raw logs\diag.json | ConvertFrom-Json | Out-Null

          # 3. Second install over the first must not download FFmpeg again.
          $p = Start-Process $installer -ArgumentList ($silent + '/MERGETASKS=!driver,!autostart', "/LOG=$PWD\logs\install2.log") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "second install exited with $($p.ExitCode)" }
          if (-not (Select-String -Path logs\install2.log -SimpleMatch 'ezdisplay: FFmpeg already present' -Quiet)) {
            throw 'second install did not detect the existing FFmpeg'
          }
          if (Select-String -Path logs\install2.log -SimpleMatch 'ezdisplay: downloading FFmpeg' -Quiet) {
            throw 'second install downloaded FFmpeg again'
          }

          # 4. Uninstall leaves nothing behind.
          $p = Start-Process "$dir\unins000.exe" -ArgumentList ($silent + "/LOG=$PWD\logs\uninstall.log") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller exited with $($p.ExitCode)" }
          # The uninstaller may hand over to a temporary copy; give it time to finish.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $dir) -and (Get-ChildItem $dir -Force) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if ((Test-Path $dir) -and (Get-ChildItem $dir -Force)) {
            Get-ChildItem $dir -Recurse -Force | Select-Object -ExpandProperty FullName
            throw 'files left after uninstall'
          }
      - name: Installer driver test (best effort)
        shell: pwsh
        # Windows Server images may lack IddCx or reject the driver: this never blocks the job.
        continue-on-error: true
        timeout-minutes: 10
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          $installer = (Get-ChildItem installer-out\ezdisplay-setup-*-x64.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:ProgramFiles 'ezdisplay'
          $silent = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          try {
            # Trust the driver publisher so Windows shows no device-software prompt.
            $cat = Join-Path $env:RUNNER_TEMP 'staging\driver\mttvdd.cat'
            $cert = (Get-AuthenticodeSignature $cat).SignerCertificate
            if (-not $cert) { throw 'mttvdd.cat has no signer certificate' }
            $store = [Security.Cryptography.X509Certificates.X509Store]::new('TrustedPublisher', 'LocalMachine')
            $store.Open('ReadWrite')
            $store.Add($cert)
            $store.Close()

            $p = Start-Process $installer -ArgumentList ($silent + '/MERGETASKS=!autostart', "/LOG=$PWD\logs\install-driver.log") -Wait -PassThru
            Write-Host "installer exit code: $($p.ExitCode)"
            & "$dir\ezd-host.exe" vdd status
            & "$dir\ezd-host.exe" vdd uninstall --driver-dir "$dir\driver"
            Write-Host "vdd uninstall exit code: $LASTEXITCODE"
          } finally {
            foreach ($f in 'vdd-install.log', 'vdd-uninstall.log') {
              $path = Join-Path $env:ProgramData "ezdisplay\logs\$f"
              if (Test-Path $path) { Write-Host "--- $f"; Get-Content $path }
            }
            $unins = Join-Path $dir 'unins000.exe'
            if (Test-Path $unins) {
              Start-Process $unins -ArgumentList ($silent + "/LOG=$PWD\logs\uninstall-driver.log") -Wait
            }
          }
      - name: Collect installer logs
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          $pd = Join-Path $env:ProgramData 'ezdisplay\logs'
          if (Test-Path $pd) { Copy-Item "$pd\*" logs\ -Force }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ezdisplay-installer-logs
          path: logs/
          if-no-files-found: ignore

  cross-check:
    name: Cross-check (Android, Windows)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Protocol and link crates build for Android
        run: cargo check --target aarch64-linux-android -p ezd-proto -p ezd-link
      - name: Platform-independent crates build for Windows
        run: cargo check --target x86_64-pc-windows-msvc -p ezd-proto -p ezd-link -p ezd-host-core -p ezd-host-windows -p ezd-host-service -p ezd-host -p ezd-tray --no-default-features
