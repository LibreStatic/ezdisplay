name: Release

# Every push to main publishes a GitHub pre-release tagged `v<workspace version>+<run number>`.
# Pushing a tag `v<workspace version>` (see docs/releasing.md) publishes the release of that version.
# "Run workflow" with dry_run builds the same set and uploads it as the `release-preview` artifact
# without creating a release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build everything and upload release-preview, but create no release"
        type: boolean
        default: true

permissions:
  contents: read

# Releases of different pushes never cancel each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version check
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      mode: ${{ steps.version.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)
          [ -n "$version" ] || { echo "cannot read the workspace version from Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Workspace version: $version"
          # mode: release (a v* tag), prerelease (a push to main) or preview (no release).
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the workspace version (expected v$version)"
              exit 1
            fi
            tag=$GITHUB_REF_NAME
            if [ "$GITHUB_EVENT_NAME" = push ] || [ "$DRY_RUN" = false ]; then mode=release; else mode=preview; fi
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            tag="v$version+$GITHUB_RUN_NUMBER"
            mode=prerelease
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists, building a preview only"
              mode=preview
            fi
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$DRY_RUN" = false ]; then
            echo "::error::a real release needs a tag: run the workflow on a v* tag, not on $GITHUB_REF_NAME"
            exit 1
          else
            tag=
            mode=preview
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Tag: ${tag:-none}, mode: $mode"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  android:
    name: Android
    needs: version
    uses: ./.github/workflows/android.yml

  linux:
    name: Linux packages
    needs: version
    uses: ./.github/workflows/linux-packages.yml

  publish:
    name: Publish
    needs: [version, ci, android, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      MODE: ${{ needs.version.outputs.mode }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ezdisplay-*
          path: dl
      - name: Collect the release files
        run: |
          set -euo pipefail
          mkdir release
          one() { # one DIR GLOB: copy exactly one file
            local files
            files=$(find "dl/$1" -type f -name "$2")
            [ "$(echo "$files" | grep -c .)" = 1 ] || { echo "expected one $2 in dl/$1, got: $files"; exit 1; }
            cp "$files" release/
          }
          one ezdisplay-windows-installer 'ezdisplay-setup-*-x64.exe'
          one ezdisplay-arch 'ezdisplay-*.pkg.tar.zst'
          for id in ubuntu24.04 debian13 ubuntu26.04; do
            one "ezdisplay-deb-$id" 'ezdisplay_*.deb'
          done
          one ezdisplay-appimage 'ezdisplay-*.AppImage'
          chmod +x release/*.AppImage
          mv dl/ezdisplay-appimage-sources "ezdisplay-$VERSION-appimage-sources"
          tar -cf "release/ezdisplay-$VERSION-appimage-sources.tar" "ezdisplay-$VERSION-appimage-sources"
          apks=$(find dl/ezdisplay-android-apks -type f -name '*.apk')
          [ -n "$apks" ] || { echo "no APKs found"; exit 1; }
          for apk in $apks; do
            flavor=$(basename "$(dirname "$(dirname "$apk")")") # <flavor>/debug/<file>.apk
            cp "$apk" "release/ezdisplay-$VERSION-$flavor-debug.apk"
          done
          (cd release && sha256sum -- * > ../SHA256SUMS)
          mv SHA256SUMS release/
          ls -l release
          cat release/SHA256SUMS
      - name: Create the GitHub Release
        if: env.MODE == 'release'
        run: |
          prerelease=
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ezdisplay $VERSION" --generate-notes $prerelease release/*
      - name: Create the GitHub pre-release of this build
        if: env.MODE == 'prerelease'
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ezdisplay $VERSION (build $GITHUB_RUN_NUMBER)" --generate-notes --prerelease release/*
      - name: Upload the preview
        if: env.MODE == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: release-preview
          path: release/
          if-no-files-found: error
